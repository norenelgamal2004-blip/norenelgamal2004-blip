<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px 40px;
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            margin-bottom: 40px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #999;
            font-size: 1em;
        }

        .joke-container {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border: 2px solid #667eea30;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .joke-text {
            color: #333;
            font-size: 1.3em;
            line-height: 1.6;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .joke-punchline {
            color: #667eea;
            font-size: 1.1em;
            font-weight: 600;
            margin-top: 10px;
            opacity: 0;
            animation: revealPunchline 0.8s ease-out 0.3s forwards;
        }

        @keyframes revealPunchline {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .joke-type {
            color: #764ba2;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #667eea30;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #c62828;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            min-width: 180px;
        }

        .btn:hover {
            background: #764ba2;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
            box-shadow: 0 10px 25px rgba(108, 117, 125, 0.4);
        }

        .filter-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .filter-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1em;
        }

        .category-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .category-btn {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .category-btn:hover {
            background: #667eea;
            color: white;
        }

        .category-btn.active {
            background: #667eea;
            color: white;
        }

        .stats {
            color: #999;
            font-size: 0.9em;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .emoji {
            font-size: 1.2em;
            margin-right: 5px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .joke-text {
                font-size: 1.1em;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                min-width: unset;
            }

            .category-buttons {
                flex-direction: column;
            }

            .category-btn {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>😂 Joke Generator</h1>
            <p>Get random jokes from the internet!</p>
        </div>

        <div class="filter-section">
            <h3>📂 Select Category</h3>
            <div class="category-buttons">
                <button class="category-btn active" data-category="any">Any</button>
                <button class="category-btn" data-category="general">General</button>
                <button class="category-btn" data-category="programming">Programming</button>
                <button class="category-btn" data-category="knock-knock">Knock-Knock</button>
            </div>
        </div>

        <div id="errorMessage"></div>

        <div class="joke-container">
            <div id="jokeContent">
                <p style="color: #999;">Click the button below to get a joke!</p>
            </div>
        </div>

        <div class="button-group">
            <button class="btn" id="getJokeBtn">
                <span class="emoji">🎲</span>
                Get Joke
            </button>
            <button class="btn btn-secondary" id="copyBtn">
                <span class="emoji">📋</span>
                Copy
            </button>
            <button class="btn btn-secondary" id="shareBtn">
                <span class="emoji">📤</span>
                Share
            </button>
        </div>

        <div class="stats">
            <p>Jokes loaded: <strong id="jokeCount">0</strong></p>
        </div>
    </div>

    <script>
        let currentJoke = '';
        let jokeCount = 0;
        let selectedCategory = 'any';

        // API endpoints
        const API_URLS = {
            any: 'https://v2.jokeapi.dev/joke/Any',
            general: 'https://v2.jokeapi.dev/joke/General',
            programming: 'https://v2.jokeapi.dev/joke/Programming',
            'knock-knock': 'https://v2.jokeapi.dev/joke/Knock-Knock'
        };

        // Category button listeners
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedCategory = btn.dataset.category;
            });
        });

        // Get joke button
        document.getElementById('getJokeBtn').addEventListener('click', fetchJoke);

        // Copy button
        document.getElementById('copyBtn').addEventListener('click', () => {
            if (currentJoke) {
                navigator.clipboard.writeText(currentJoke).then(() => {
                    const btn = document.getElementById('copyBtn');
                    const originalText = btn.innerHTML;
                    btn.innerHTML = '<span class="emoji">✅</span>Copied!';
                    setTimeout(() => {
                        btn.innerHTML = originalText;
                    }, 2000);
                });
            }
        });

        // Share button
        document.getElementById('shareBtn').addEventListener('click', () => {
            if (currentJoke && navigator.share) {
                navigator.share({
                    title: 'Check out this joke!',
                    text: currentJoke
                }).catch(err => console.log('Share cancelled'));
            } else if (currentJoke) {
                alert('Share API not supported on this device. Use Copy instead!');
            }
        });

        // Fetch joke from API
        async function fetchJoke() {
            const btn = document.getElementById('getJokeBtn');
            const errorDiv = document.getElementById('errorMessage');
            const jokeDiv = document.getElementById('jokeContent');

            // Disable button and show loading
            btn.disabled = true;
            btn.innerHTML = '<div class="loading"></div>Loading...';
            errorDiv.innerHTML = '';

            try {
                const url = API_URLS[selectedCategory];
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();

                // Check if joke type is single or two-part
                if (data.type === 'single') {
                    currentJoke = data.joke;
                    jokeDiv.innerHTML = `
                        <div class="joke-type">${data.category}</div>
                        <div class="joke-text">${data.joke}</div>
                    `;
                } else if (data.type === 'twopart') {
                    currentJoke = `${data.setup}\n${data.delivery}`;
                    jokeDiv.innerHTML = `
                        <div class="joke-type">${data.category}</div>
                        <div class="joke-text">${data.setup}</div>
                        <div class="joke-punchline">${data.delivery}</div>
                    `;
                }

                jokeCount++;
                document.getElementById('jokeCount').textContent = jokeCount;

            } catch (error) {
                errorDiv.innerHTML = `
                    <div class="error-message">
                        <strong>Oops!</strong> Failed to load joke. Please try again.
                    </div>
                `;
                jokeDiv.innerHTML = '<p style="color: #999;">Click the button to get a joke!</p>';
                console.error('Error:', error);

            } finally {
                // Re-enable button
                btn.disabled = false;
                btn.innerHTML = '<span class="emoji">🎲</span>Get Joke';
            }
        }

        // Load a joke on page load
        window.addEventListener('load', () => {
            setTimeout(fetchJoke, 300);
        });

        // Keyboard shortcut (Space to get joke)
        document.addEventListener('keypress', (e) => {
            if (e.code === 'Space' && !document.getElementById('getJokeBtn').disabled) {
                e.preventDefault();
                fetchJoke();
            }
        });
    </script>
</body>
</html>
